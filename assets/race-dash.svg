<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <pattern id="chk" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#111"/>
      <rect width="16" height="16" fill="#f2f2f2"/>
      <rect x="16" y="16" width="16" height="16" fill="#f2f2f2"/>
    </pattern>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="44"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#0d0d13"/>
  <rect x="8" y="8" width="240" height="32" fill="url(#chk)" clip-path="url(#tile)"/>
  <!-- Gauge: centre (128,152), radius 88. Track spans 150deg -> 30deg over the top (240deg). -->
  <path d="M 51.8 196 A 88 88 0 1 1 204.2 196" fill="none" stroke="#2a2a36" stroke-width="18" stroke-linecap="round"/>
  <!-- Red fill: 150deg -> 300deg on the same circle. -->
  <path d="M 51.8 196 A 88 88 0 0 1 172 75.8" fill="none" stroke="#e10600" stroke-width="18" stroke-linecap="round"/>
  <!-- Needle pointing at the end of the red fill. -->
  <line x1="128" y1="152" x2="161" y2="94.8" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="152" r="14" fill="#ffffff"/>
  <text x="128" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">RACE DASH</text>
</svg>
